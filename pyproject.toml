[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thaimooc-course-advisor"
version = "0.1.0"
description = "Evidence-grounded Thai MOOC course search and optional local RAG"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2", "fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
dev = ["httpx>=0.27,<1"]

[project.scripts]
thaimooc = "thaimooc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thaimooc = ["web/*.html", "web/*.css", "web/*.js"]
